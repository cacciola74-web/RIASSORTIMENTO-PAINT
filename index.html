<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riassortimento Ordini - RIVIERA BASIC & PAINT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

  <header class="bg-blue-900 text-white p-4 shadow-md mb-6">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-cart-shopping"></i> Riassortimento Ordini - RIVIERA BASIC & PAINT
      </h1>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 space-y-6">

    <!-- SELEZIONE PRODOTTO -->
    <section class="bg-white rounded-lg p-6 shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-list-check text-blue-600"></i> Selezione Prodotto
      </h2>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-1">1. Seleziona Articolo / Codice:</label>
          <select id="productSelect" class="w-full border border-slate-300 rounded p-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">-- Seleziona un articolo --</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">2. Inserisci Variante / Colore / Misura:</label>
          <input type="text" id="variantInput" placeholder="Es. 0101 BIANCO" class="w-full border border-slate-300 rounded p-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <p class="text-xs text-slate-400 mt-1">Carica l'immagine corrispondente in <code>img/</code> per attivare l'anteprima.</p>
        </div>

        <!-- ANTEPRIMA MINIATURA -->
        <div id="previewContainer" class="flex items-center gap-4 bg-slate-50 p-3 rounded border border-slate-200">
          <div class="w-16 h-16 bg-slate-200 rounded flex items-center justify-center overflow-hidden border border-slate-300">
            <img id="previewImage" src="" alt="Anteprima" class="w-full h-full object-cover hidden" onerror="this.classList.add('hidden'); document.getElementById('previewIcon').classList.remove('hidden');">
            <i id="previewIcon" class="fa-solid fa-shirt text-slate-300 text-2xl"></i>
          </div>
          <div>
            <div id="previewTitle" class="font-bold text-sm text-slate-800">Nessun articolo selezionato</div>
            <div id="previewVariant" class="text-xs text-slate-500">Variante: -</div>
          </div>
        </div>

        <div class="flex gap-4 items-center">
          <div class="w-1/2">
            <label class="block text-sm font-semibold mb-1">Quantità (Pezzi):</label>
            <input type="number" id="qtyInput" min="1" value="1" class="w-full border border-slate-300 rounded p-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="w-1/2 flex items-end">
            <button id="addBtn" onclick="addToOrder()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow transition">
              <i class="fa-solid fa-plus"></i> Aggiungi all'Ordine
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- RIEPILOGO ORDINE -->
    <section class="bg-white rounded-lg p-6 shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-file-invoice text-blue-600"></i> Riepilogo Ordine
      </h2>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="bg-slate-100 border-b border-slate-200 text-slate-600">
              <th class="p-2">Foto</th>
              <th class="p-2">Codice</th>
              <th class="p-2">Descrizione</th>
              <th class="p-2">Variante</th>
              <th class="p-2 text-center">Qtà</th>
              <th class="p-2 text-right">Prezzo</th>
              <th class="p-2 text-center">Azione</th>
            </tr>
          </thead>
          <tbody id="orderTableBody">
            <tr>
              <td colspan="7" class="p-4 text-center text-slate-400">Nessun articolo aggiunto all'ordine.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    // LISTA COMPLETA PRODOTTI (PAINT, SFUSI & ACCESSORI RIVIERA BASIC)
    const products = [
      /* PAINT COMPLETI & SFUSI */
      { code: "LN0506", name: "Completo Letto Matrimoniale 2P", price: "29,90", pack: 2 },
      { code: "LN1862", name: "Completo Letto King Size", price: "33,50", pack: 2 },
      { code: "LN0508", name: "Completo Letto Piazza e Mezza Francese", price: "28,50", pack: 2 },
      { code: "LN0507", name: "Completo Letto Piazza e Mezza", price: "23,90", pack: 2 },
      { code: "LN0509", name: "Completo Letto Singolo 1P", price: "19,90", pack: 2 },
      { code: "LF0179", name: "Parure Copripiumino Matrimoniale", price: "30,90", pack: 2 },
      { code: "LF0180", name: "Parure Copripiumino Piazza e Mezza", price: "26,90", pack: 2 },
      { code: "LF0181", name: "Parure Copripiumino Singolo", price: "20,90", pack: 2 },

      /* ACCESSORI - COPRIMATERASSO */
      { code: "LH0005", name: "Coprimaterasso Sanitario 175x200", price: "19,90", pack: 4 },
      { code: "LH0006", name: "Coprimaterasso Sanitario 125x200", price: "16,90", pack: 4 },
      { code: "LH0007", name: "Coprimaterasso Sanitario 90x200", price: "12,90", pack: 6 },
      { code: "LH0008", name: "Coprimaterasso Spugna Jersey 175x200", price: "13,50", pack: 4 },
      { code: "LH0009", name: "Coprimaterasso Spugna Jersey 125x200", price: "11,50", pack: 4 },
      { code: "LH0010", name: "Coprimaterasso Spugna Jersey 90x200", price: "9,50", pack: 6 },
      { code: "LH0011", name: "Coprimaterasso Jacquard Rigato 170x200", price: "16,20", pack: 4 },
      { code: "LH0012", name: "Coprimaterasso Jacquard Rigato 120x200", price: "14,00", pack: 4 },
      { code: "LH0013", name: "Coprimaterasso Jacquard Rigato 85x200", price: "11,00", pack: 6 },
      { code: "LH0014", name: "Coprimaterasso 3D 165x200", price: "16,50", pack: 4 },
      { code: "LH0015", name: "Coprimaterasso 3D 125x200", price: "14,50", pack: 4 },
      { code: "LH0016", name: "Coprimaterasso 3D 90x200", price: "11,30", pack: 6 },
      { code: "LH0017", name: "Coprimaterasso 3D Lettino C/Angoli 65x130", price: "7,90", pack: 6 },

      /* ACCESSORI - SALVAMATERASSO */
      { code: "LH0031", name: "Salvamaterasso Stretch 175-195 cm", price: "15,90", pack: 4 },
      { code: "LH0033", name: "Salvamaterasso Stretch 125-145 cm", price: "12,50", pack: 4 },
      { code: "LH0032", name: "Salvamaterasso Stretch 90-100 cm", price: "9,90", pack: 6 },
      { code: "LH0034", name: "Salvamaterasso Termo Regolatore 160x200", price: "37,90", pack: 2 },
      { code: "LH0035", name: "Salvamaterasso Termo Regolatore 120x200", price: "31,50", pack: 1 },
      { code: "LH0036", name: "Salvamaterasso Termo Regolatore 90x200", price: "25,50", pack: 2 },

      /* ACCESSORI - TOPPER */
      { code: "LH0027", name: "Topper Four Season 180x200+5", price: "79,90", pack: 2 },
      { code: "LH0028", name: "Topper Four Season 160x200+5", price: "69,00", pack: 2 },
      { code: "LH0029", name: "Topper Four Season 120x200+5", price: "56,90", pack: 2 },
      { code: "LH0030", name: "Topper Four Season 90x200+5", price: "44,90", pack: 2 },
      { code: "LH0019", name: "Topper Percalle 180x200+5", price: "59,90", pack: 2 },
      { code: "LH0020", name: "Topper Percalle 160x200+5", price: "47,90", pack: 2 },
      { code: "LH0021", name: "Topper Percalle 120x200+5", price: "44,90", pack: 2 },
      { code: "LH0022", name: "Topper Percalle 90x200+5", price: "35,90", pack: 2 },

      /* ACCESSORI - INTERNO PIUMINO */
      { code: "LK0044", name: "Switch&Dream Interno Piumino 4 Stagioni Percalle", price: "79,90", pack: 2 },
      { code: "LK0032", name: "Interno Piumino 100 GSM Percalle 250x200", price: "33,90", pack: 2 },
      { code: "LK0033", name: "Interno Piumino 100 GSM Percalle 200x200", price: "28,90", pack: 2 },
      { code: "LK0034", name: "Interno Piumino 100 GSM Percalle 150x200", price: "22,90", pack: 2 },
      { code: "LK0035", name: "Interno Piumino 220 GSM Percalle 250x200", price: "37,90", pack: 2 },
      { code: "LK0036", name: "Interno Piumino 220 GSM Percalle 200x200", price: "33,90", pack: 2 },
      { code: "LK0037", name: "Interno Piumino 220 GSM Percalle 150x200", price: "25,90", pack: 2 },
      { code: "LK0038", name: "Interno Piumino 320 GSM Percalle 250x200", price: "39,90", pack: 2 },
      { code: "LK0039", name: "Interno Piumino 320 GSM Percalle 200x200", price: "34,90", pack: 2 },
      { code: "LK0040", name: "Interno Piumino 320 GSM Percalle 150x200", price: "29,90", pack: 2 },
      { code: "LK0041", "name": "Interno Piumino 4 Stagioni Percalle 250x200", price: "69,90", pack: 2 },
      { code: "LK0042", "name": "Interno Piumino 4 Stagioni Percalle 200x200", price: "59,90", pack: 2 },
      { code: "LK0043", "name": "Interno Piumino 4 Stagioni Percalle 150x200", price: "46,90", pack: 2 },

      /* ACCESSORI - GUANCIALI & COPRIGUANCIALI */
      { code: "LJ0002", name: "Guanciale Memory Viscogel 45x75", price: "28,50", pack: 2 },
      { code: "LJ0005", name: "Guanciale Memory 42x72 H13", price: "15,50", pack: 8 },
      { code: "LJ0003", name: "Guanciale Soft Poliestere 50x80 H18", price: "13,50", pack: 8 },
      { code: "LJ0004", name: "Guanciale Nuvola Poliestere 50x80 H17", price: "6,10", pack: 8 },
      { code: "LM0073", name: "Coppia Copriguanciale Cotone Jacquard Rigato 50x80", price: "7,90", pack: 12 },
      { code: "LM0072", name: "Coppia Copriguanciale Spugna Jersey 50x80", price: "6,50", pack: 12 },
      { code: "LM0074", name: "Copriguanciale 3D 50x80", price: "5,40", pack: 12 }
    ];

    const orderItems = [];

    // Popola il menu a tendina
    const productSelect = document.getElementById('productSelect');
    products.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.code;
      opt.textContent = `${p.name} - Cod. ${p.code} - € ${p.price}`;
      productSelect.appendChild(opt);
    });

    // Aggiorna anteprima miniatura
    function updatePreview() {
      const selectedCode = productSelect.value;
      const variantText = document.getElementById('variantInput').value.trim();
      const p = products.find(x => x.code === selectedCode);

      const previewImage = document.getElementById('previewImage');
      const previewIcon = document.getElementById('previewIcon');
      const previewTitle = document.getElementById('previewTitle');
      const previewVariant = document.getElementById('previewVariant');

      if (p) {
        previewTitle.textContent = `${p.name} (${p.code})`;
        previewVariant.textContent = `Variante: ${variantText || 'Nessuna'}`;

        // Regola estrazione codice variante numerico per l'immagine
        const cleanVariant = variantText.split(' ')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
        if (cleanVariant) {
          previewImage.src = `img/${cleanVariant}.jpg`;
          previewImage.classList.remove('hidden');
          previewIcon.classList.add('hidden');
        } else {
          previewImage.classList.add('hidden');
          previewIcon.classList.remove('hidden');
        }
      } else {
        previewTitle.textContent = "Nessun articolo selezionato";
        previewVariant.textContent = "Variante: -";
        previewImage.classList.add('hidden');
        previewIcon.classList.remove('hidden');
      }
    }

    productSelect.addEventListener('change', updatePreview);
    document.getElementById('variantInput').addEventListener('input', updatePreview);

    // Aggiungi elemento all'ordine
    function addToOrder() {
      const selectedCode = productSelect.value;
      const variantText = document.getElementById('variantInput').value.trim();
      const qty = parseInt(document.getElementById('qtyInput').value) || 1;

      if (!selectedCode) {
        alert("Seleziona prima un articolo!");
        return;
      }

      const p = products.find(x => x.code === selectedCode);
      const cleanVariant = variantText.split(' ')[0].toLowerCase().replace(/[^a-z0-9]/g, '');

      orderItems.push({
        code: p.code,
        name: p.name,
        price: p.price,
        variant: variantText || '-',
        imgCode: cleanVariant,
        qty: qty
      });

      renderOrderTable();
    }

    // Rendering tabella ordine
    function renderOrderTable() {
      const tbody = document.getElementById('orderTableBody');
      if (orderItems.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400">Nessun articolo aggiunto all'ordine.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      orderItems.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.className = "border-b border-slate-200 hover:bg-slate-50";

        const imgSrc = item.imgCode ? `img/${item.imgCode}.jpg` : '';

        tr.innerHTML = `
          <td class="p-2">
            <div class="w-10 h-10 bg-slate-100 rounded flex items-center justify-center overflow-hidden border border-slate-200">
              ${item.imgCode ? `<img src="${imgSrc}" class="w-full h-full object-cover" onerror="this.outerHTML='<i class=\\'fa-solid fa-shirt text-slate-300\\'></i>'">` : `<i class="fa-solid fa-shirt text-slate-300"></i>`}
            </div>
          </td>
          <td class="p-2 font-mono text-xs font-bold">${item.code}</td>
          <td class="p-2">${item.name}</td>
          <td class="p-2 text-slate-600">${item.variant}</td>
          <td class="p-2 text-center font-bold">${item.qty}</td>
          <td class="p-2 text-right font-semibold">€ ${item.price}</td>
          <td class="p-2 text-center">
            <button onclick="removeOrderItem(${index})" class="text-red-500 hover:text-red-700">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function removeOrderItem(index) {
      orderItems.splice(index, 1);
      renderOrderTable();
    }
  </script>
</body>
</html>
