<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riviera Basic - Linea PAINT | Modulo Ordini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            header, section, .no-print, button, select, input { 
                display: none !important; 
            }
            
            html, body { 
                background: #ffffff !important; 
                color: #000000 !important;
                padding: 0 !important; 
                margin: 0 !important;
                height: auto !important;
                min-height: 0 !important;
                overflow: visible !important;
            }
            
            #pdfContent { 
                display: block !important;
                visibility: visible !important;
                position: relative !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 15px !important;
                border: none !important;
                box-shadow: none !important;
                background: #ffffff !important;
            }

            #pdfContent table {
                width: 100% !important;
                border-collapse: collapse !important;
                background: #ffffff !important;
            }

            #pdfContent th, 
            #pdfContent td {
                border-bottom: 1px solid #cbd5e1 !important;
                padding: 8px 4px !important;
                color: #000000 !important;
            }

            #pdfContent tr {
                page-break-inside: avoid !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

    <!-- Header -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50 no-print">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide"><i class="fa-solid fa-palette mr-2"></i>RIVIERA BASIC</h1>
                <p class="text-xs text-indigo-200">Linea PAINT - Modulo Riassortimento Ordini</p>
            </div>
            <button onclick="resetForm()" class="text-xs bg-indigo-800 hover:bg-indigo-700 px-3 py-2 rounded transition">
                <i class="fa-solid fa-rotate-left mr-1"></i> Nuovo Ordine
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">

        <!-- Dati Cliente -->
        <section class="bg-white p-5 rounded-xl shadow-md no-print border border-slate-200">
            <h2 class="text-base font-semibold text-slate-700 mb-4 border-b pb-2 flex items-center">
                <i class="fa-solid fa-user-tag text-indigo-600 mr-2"></i> Dati Anagrafici Cliente
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Ragione Sociale / Cliente *</label>
                    <input type="text" id="clientName" placeholder="Es. Rossi Home" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Città / Località</label>
                    <input type="text" id="clientCity" placeholder="Es. Catania" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">P.IVA / Cod. Univoco / SDI</label>
                    <input type="text" id="clientVat" placeholder="IT0123456789" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>
        </section>

        <!-- Inserimento Articolo -->
        <section class="bg-white p-5 rounded-xl shadow-md no-print border border-slate-200">
            <h2 class="text-base font-semibold text-slate-700 mb-4 border-b pb-2 flex items-center">
                <i class="fa-solid fa-cart-plus text-indigo-600 mr-2"></i> Seleziona Prodotto dal Copia Commissione
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-slate-600 mb-1">Articolo - Misura - Codice - Listino</label>
                    <select id="itemSelect" onchange="onItemChange()" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">-- Seleziona Articolo --</option>
                        
                        <!-- COMPLETO LETTO -->
                        <optgroup label="COMPLETO LETTO">
                            <option value="Completo Letto 2P (LN0506)" data-code="LN0506" data-price="29.90" data-category="standard">Completo Letto 2P - Cod. LN0506 - € 29,90</option>
                            <option value="Completo Letto KING SIZE (LN1862)" data-code="LN1862" data-price="33.50" data-category="king">Completo Letto KING SIZE - Cod. LN1862 - € 33,50</option>
                            <option value="Completo Letto 1+1/2P FRANCESE (LN0508)" data-code="LN0508" data-price="28.50" data-category="francese">Completo Letto 1+1/2P FRANCESE - Cod. LN0508 - € 28,50</option>
                            <option value="Completo Letto 1+1/2P (LN0507)" data-code="LN0507" data-price="23.90" data-category="standard">Completo Letto 1+1/2P - Cod. LN0507 - € 23,90</option>
                            <option value="Completo Letto 1P (LN0509)" data-code="LN0509" data-price="19.90" data-category="standard">Completo Letto 1P - Cod. LN0509 - € 19,90</option>
                        </optgroup>

                        <!-- PARURE COPRIPIUMINO -->
                        <optgroup label="PARURE COPRIPIUMINO">
                            <option value="Parure Copripiumino 2P (LF0179)" data-code="LF0179" data-price="30.90" data-category="standard">Parure Copripiumino 2P - Cod. LF0179 - € 30,90</option>
                            <option value="Parure Copripiumino 1+1/2P (LF0180)" data-code="LF0180" data-price="26.90" data-category="standard">Parure Copripiumino 1+1/2P - Cod. LF0180 - € 26,90</option>
                            <option value="Parure Copripiumino 1P (LF0181)" data-code="LF0181" data-price="20.90" data-category="standard">Parure Copripiumino 1P - Cod. LF0181 - € 20,90</option>
                        </optgroup>

                        <!-- QUILT DOUBLE TRAPUNTATO -->
                        <optgroup label="QUILT DOUBLE TRAPUNTATO">
                            <option value="Quilt Double Trapuntato 2P (LE0607)" data-code="LE0607" data-price="44.90" data-category="quilt">Quilt Double Trapuntato 2P - Cod. LE0607 - € 44,90</option>
                            <option value="Quilt Double Trapuntato 1+1/2P (LE0624)" data-code="LE0624" data-price="39.90" data-category="quilt">Quilt Double Trapuntato 1+1/2P - Cod. LE0624 - € 39,90</option>
                            <option value="Quilt Double Trapuntato 1P (LE0625)" data-code="LE0625" data-price="34.90" data-category="quilt">Quilt Double Trapuntato 1P - Cod. LE0625 - € 34,90</option>
                        </optgroup>

                        <!-- LENZUOLO SOPRA -->
                        <optgroup label="LENZUOLO SOPRA">
                            <option value="Lenzuolo Sopra 2P (LP0001)" data-code="LP0001" data-price="13.50" data-category="standard">Lenzuolo Sopra 2P - Cod. LP0001 - € 13,50</option>
                            <option value="Lenzuolo Sopra 1+1/2P FRANCESE (LP0003)" data-code="LP0003" data-price="12.90" data-category="francese">Lenzuolo Sopra 1+1/2P FRANCESE - Cod. LP0003 - € 12,90</option>
                            <option value="Lenzuolo Sopra 1+1/2P (LP0002)" data-code="LP0002" data-price="11.50" data-category="standard">Lenzuolo Sopra 1+1/2P - Cod. LP0002 - € 11,50</option>
                            <option value="Lenzuolo Sopra 1P (LP0004)" data-code="LP0004" data-price="9.90" data-category="standard">Lenzuolo Sopra 1P - Cod. LP0004 - € 9,90</option>
                        </optgroup>

                        <!-- LENZUOLO SOTTO CON ANGOLI -->
                        <optgroup label="LENZUOLO SOTTO CON ANGOLI">
                            <option value="Lenzuolo Sotto c/Angoli 2P MAXI (LQ0002)" data-code="LQ0002" data-price="11.50" data-category="standard">Lenzuolo Sotto c/Angoli 2P MAXI - Cod. LQ0002 - € 11,50</option>
                            <option value="Lenzuolo Sotto c/Angoli 2P (LQ0058)" data-code="LQ0058" data-price="10.50" data-category="standard">Lenzuolo Sotto c/Angoli 2P - Cod. LQ0058 - € 10,50</option>
                            <option value="Lenzuolo Sotto c/Angoli KING SIZE (LQ0054)" data-code="LQ0054" data-price="13.50" data-category="king">Lenzuolo Sotto c/Angoli KING SIZE - Cod. LQ0054 - € 13,50</option>
                            <option value="Lenzuolo Sotto c/Angoli 1+1/2P FRANCESE (LQ0004)" data-code="LQ0004" data-price="10.30" data-category="francese">Lenzuolo Sotto c/Angoli 1+1/2P FRANCESE - Cod. LQ0004 - € 10,30</option>
                            <option value="Lenzuolo Sotto c/Angoli 1+1/2P (LQ0003)" data-code="LQ0003" data-price="9.90" data-category="standard">Lenzuolo Sotto c/Angoli 1+1/2P - Cod. LQ0003 - € 9,90</option>
                            <option value="Lenzuolo Sotto c/Angoli 1P (LQ0005)" data-code="LQ0005" data-price="7.90" data-category="standard">Lenzuolo Sotto c/Angoli 1P - Cod. LQ0005 - € 7,90</option>
                        </optgroup>

                        <!-- COPPIA FEDERE -->
                        <optgroup label="COPPIA FEDERE">
                            <option value="Coppia Federe 50X80 (LM0068)" data-code="LM0068" data-price="7.50" data-category="standard">Coppia Federe 50X80 - Cod. LM0068 - € 7,50</option>
                        </optgroup>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Variante / Variante Colore</label>
                    <select id="itemColor" class="w-full text-sm border border-slate-300 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">-- Seleziona Prima
